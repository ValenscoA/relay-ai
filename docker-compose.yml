services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports: ["5432:5432"]
    volumes: [relay_data:/var/lib/postgresql/data]
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgres://relay:relay@postgres:5432/relay
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      ALLOWED_PROVIDER_HOSTS: ${ALLOWED_PROVIDER_HOSTS:-api.openai.com,openrouter.ai}
    depends_on: [postgres]
volumes:
  relay_data:
