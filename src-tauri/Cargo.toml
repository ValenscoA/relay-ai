[package]
name = "relay-desktop"
version = "1.0.0"
description = "A private multi-provider AI workspace"
authors = ["Valensco Aurelius"]
edition = "2024"

[lib]
name = "relay_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"

